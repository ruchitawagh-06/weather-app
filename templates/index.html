<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins';
display:flex;
color:white;
transition:1s;
}

/* DAY/NIGHT */
body.day{background:linear-gradient(135deg,#60a5fa,#38bdf8,#facc15);}
body.night{background:linear-gradient(135deg,#020617,#0f172a,#1e293b);}

/* FIX ANIMATION LAYERS */
#rain,#snow,#stars,#lightning,#moon{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
z-index:0;
}

/* UI ABOVE */
.sidebar,.main,.card,button,input{
position:relative;
z-index:5;
}

/* SIDEBAR */
.sidebar{
width:220px;
height:100vh;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(20px);
padding:20px;
}

/* MAIN */
.main{flex:1;padding:20px;}

/* CARD */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border-radius:20px;
padding:20px;
margin-top:20px;
transition:0.3s;
}
.card:hover{transform:translateY(-5px);}

/* SEARCH */
.search-box{display:flex;gap:10px;margin:15px 0;}
.search-box input{
flex:1;padding:12px;border-radius:10px;border:none;
background:rgba(255,255,255,0.1);color:white;
}

/* BUTTON */
button{
padding:10px;border-radius:10px;border:none;
background:#22c55e;color:white;cursor:pointer;
transition:0.3s;
}
button:hover{transform:scale(1.05);}

/* FORECAST */
.forecast{display:flex;gap:10px;flex-wrap:wrap;}
.fcard{
background:rgba(255,255,255,0.08);
padding:10px;border-radius:10px;width:100px;text-align:center;
}

/* MAP */
#map{height:300px;border-radius:10px;margin-top:10px;}

.map-controls{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:10px;
}

/* MOBILE */
@media(max-width:768px){
.sidebar{display:none;}
.main{padding:15px;}
.search-box{flex-direction:column;}
#map{height:250px;}
.fcard{width:80px;font-size:12px;}
}

</style>
</head>

<body class="day">

<div class="sidebar">
<h2>🌤 Weather</h2>
</div>

<div class="main">

<h1>Weather Pro</h1>

<form method="POST" class="search-box">
<input name="city" placeholder="Enter city..." required>
<button>Search</button>
</form>

<button onclick="getLocation()">📍 Use Location</button>

<!-- WEATHER -->
{% if weather %}
<div class="card">
<h2>{{ weather.city }}</h2>
<h1>{{ weather.temp }}°C</h1>
<p>{{ weather.desc }}</p>
</div>
{% endif %}

<!-- FORECAST -->
{% if forecast %}
<div class="card">
<h3>Forecast</h3>
<div class="forecast">
{% for d in forecast %}
<div class="fcard">
<p>{{ d.temp }}°C</p>
<p>{{ d.desc }}</p>
</div>
{% endfor %}
</div>
</div>
{% endif %}

<!-- CHART -->
{% if temps %}
<div class="card">
<canvas id="chart"></canvas>
</div>
{% endif %}

<!-- MAP -->
{% if weather %}
<div class="card">
<h3>🌍 Map</h3>

<div class="map-controls">
<button onclick="setMap('normal')">🗺️ Normal</button>
<button onclick="setMap('satellite')">🛰️ Satellite</button>
<button onclick="setLayer('rain')">🌧️ Rain</button>
<button onclick="clearLayer()">❌ Clear</button>
</div>

<div id="map"></div>
</div>
{% endif %}

</div>

<script>

let map, baseLayer, overlayLayer;

// LOAD MAP
function loadMap(lat,lon,text=""){
if(map){map.remove();}

map=L.map('map').setView([lat,lon],10);

baseLayer=L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

L.marker([lat,lon]).addTo(map)
.bindPopup(text)
.openPopup();
}

// SWITCH MAP
function setMap(type){
if(!map) return;

map.removeLayer(baseLayer);

if(type==="satellite"){
baseLayer=L.tileLayer(
'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'
).addTo(map);
}else{
baseLayer=L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);
}
}

// RAIN LAYER
function setLayer(type){
if(!map) return;

if(overlayLayer){
map.removeLayer(overlayLayer);
}

if(type==="rain"){
overlayLayer=L.tileLayer(
`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid={{ api_key }}`
).addTo(map);
}
}

// CLEAR LAYER
function clearLayer(){
if(overlayLayer){
map.removeLayer(overlayLayer);
}
}

// LOCATION
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

fetch(`/location?lat=${lat}&lon=${lon}`)
.then(r=>r.json())
.then(d=>{
document.querySelector("input[name='city']").value=d.city;
loadMap(lat,lon,`${d.temp}°C ${d.desc}`);
});
});
}

// AUTO LOAD MAP
{% if weather %}
loadMap({{ weather.lat }}, {{ weather.lon }},
"{{ weather.temp }}°C {{ weather.desc }}");
{% endif %}

// DAY/NIGHT
function setDayNight(){
const hour=new Date().getHours();
document.body.className=(hour>=6 && hour<18)?"day":"night";
}
setDayNight();

// CHART
{% if temps %}
new Chart(document.getElementById("chart"),{
type:'line',
data:{
labels:{{labels|tojson}},
datasets:[{
data:{{temps|tojson}},
borderColor:"cyan"
}]
}
});
{% endif %}

</script>

</body>
</html>
