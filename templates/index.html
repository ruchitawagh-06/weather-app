<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    display:flex;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

/* Sidebar */
.sidebar{
    width:220px;
    height:100vh;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(15px);
    padding:20px;
}

.sidebar a{
    display:block;
    margin:15px 0;
    color:white;
    text-decoration:none;
}

.main{flex:1;padding:20px;}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    padding:20px;
    margin-top:20px;
    border-radius:20px;
}

button{
    padding:10px;
    border-radius:10px;
    border:none;
    background:#22c55e;
    color:white;
    cursor:pointer;
}

input{
    padding:10px;
    border-radius:10px;
    border:none;
}

/* MAP */
#map{
    height:300px;
    border-radius:15px;
}

/* FULLSCREEN */
.fullscreen-map{
    position:fixed !important;
    top:0;
    left:0;
    width:100vw !important;
    height:100vh !important;
    z-index:9999;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>🌤 Weather</h2>
<a href="/">Dashboard</a>
<a href="/profile">Profile</a>
<a href="/logout">Logout</a>
</div>

<div class="main">

<h1>Weather Pro</h1>

<form method="POST">
<input name="city" placeholder="Enter city">
<button>Search</button>
</form>

<br>
<button onclick="getLocation()">📍 Use Location</button>

<!-- WEATHER -->
{% if weather %}
<div class="card">
<h2>{{ weather.city }}</h2>
<p>{{ weather.temp }}°C</p>
<p>{{ weather.desc }}</p>
</div>
{% endif %}

<!-- MAP -->
<div class="card">
<h3>🌍 Live Weather Map</h3>

<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
<button onclick="setMap('normal')">🗺️ Normal</button>
<button onclick="setMap('satellite')">🛰️ Satellite</button>

<button onclick="setLayer('temp')">🔥 Temp</button>
<button onclick="setLayer('rain')">🌧️ Rain</button>
<button onclick="setLayer('clouds')">☁️ Clouds</button>
<button onclick="setLayer('wind')">🌪️ Wind</button>

<button onclick="setLayer('clear')">❌ Clear</button>
<button onclick="toggleFullscreen()">🖥️ Fullscreen</button>
</div>

<div id="map"></div>
</div>

</div>

<script>

let map;
let baseLayer;
let overlayLayer;
const API_KEY = "{{ api_key }}";

// LOAD MAP
function loadMap(lat, lon, weatherText=""){

if(map){
    map.remove();
}

map = L.map('map').setView([lat, lon], 10);

baseLayer = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

L.marker([lat, lon]).addTo(map)
.bindPopup(`<b>📍 Location</b><br>${weatherText}`)
.openPopup();
}

// BASE MAP SWITCH
function setMap(type){

if(!map) return;

map.removeLayer(baseLayer);

if(type==="satellite"){
    baseLayer = L.tileLayer(
        'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'
    ).addTo(map);
}else{
    baseLayer = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
    ).addTo(map);
}
}

// WEATHER LAYERS
function setLayer(type){

if(!map) return;

if(overlayLayer){
    map.removeLayer(overlayLayer);
}

if(type==="temp"){
    overlayLayer = L.tileLayer(
        `https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`,
        {opacity:0.5}
    ).addTo(map);

}else if(type==="rain"){
    overlayLayer = L.tileLayer(
        `https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`,
        {opacity:0.6}
    ).addTo(map);

}else if(type==="clouds"){
    overlayLayer = L.tileLayer(
        `https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`,
        {opacity:0.5}
    ).addTo(map);

}else if(type==="wind"){
    overlayLayer = L.tileLayer(
        `https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${API_KEY}`,
        {opacity:0.6}
    ).addTo(map);

}else if(type==="clear"){
    overlayLayer = null;
}
}

// CLOUD ANIMATION
setInterval(()=>{
    if(overlayLayer){
        overlayLayer.setUrl(overlayLayer._url);
    }
}, 5000);

// LOCATION
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{

let lat = pos.coords.latitude;
let lon = pos.coords.longitude;

fetch(`/location?lat=${lat}&lon=${lon}`)
.then(r=>r.json())
.then(d=>{

document.querySelector("input[name='city']").value = d.city;

let weatherInfo = `${d.temp || ''}°C ${d.desc || ''}`;

loadMap(lat, lon, weatherInfo);

});
});
}

// FULLSCREEN
function toggleFullscreen(){
const mapDiv = document.getElementById("map");
mapDiv.classList.toggle("fullscreen-map");

setTimeout(()=>{
    map.invalidateSize();
},300);
}

</script>

</body>
</html>
