<!DOCTYPE html>
<html>
<head>
<title>Weather Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Poppins;background:#0f172a;color:white;}
.card{background:#1e293b;padding:20px;margin:20px;border-radius:10px;}
button{padding:10px;background:#22c55e;color:white;border:none;}
#map{height:300px;border-radius:10px;}
</style>
</head>

<body>

<h1>Weather Pro</h1>

<form method="POST">
<input name="city">
<button>Search</button>
</form>

<button onclick="getLocation()">📍 Location</button>
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="enableNotifications()">🔔 Notify</button>

<div id="map"></div>

{% if weather %}
<div class="card">
<h2>{{ weather.city }}</h2>
<p>{{ weather.temp }}°C</p>
<p>{{ weather.desc }}</p>
</div>
{% endif %}

{% if forecast %}
<div class="card">
{% for d in forecast %}
<p>{{ d.temp }}°C - {{ d.desc }}</p>
{% endfor %}
</div>
{% endif %}

<canvas id="chart"></canvas>

<div class="card">
<input id="chatInput">
<button onclick="askAI()">Ask</button>
<p id="chatResponse"></p>
</div>

<script>

// LOCATION + MAP
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

var map=L.map('map').setView([lat,lon],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([lat,lon]).addTo(map);

fetch(`/location?lat=${lat}&lon=${lon}`)
.then(r=>r.json())
.then(d=>{
document.querySelector("input[name='city']").value=d.city;
});
});
}

// AI
function askAI(){
fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({msg:chatInput.value})
})
.then(r=>r.json())
.then(d=>chatResponse.innerText=d.reply);
}

// THEME
function toggleTheme(){
document.body.style.background =
document.body.style.background=="white" ? "#0f172a" : "white";
}

// NOTIFICATION
function enableNotifications(){
Notification.requestPermission().then(p=>{
if(p==="granted"){
new Notification("Weather Pro Ready 🔔");
}
});
}

</script>

</body>
</html>
