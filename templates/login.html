<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:'Poppins',sans-serif;
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg,#0f172a,#1e293b,#1e3a8a,#0ea5e9);
color:white;
}

/* CARD */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
padding:30px;
border-radius:20px;
width:300px;
text-align:center;
border:1px solid rgba(255,255,255,0.2);
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.1);
color:white;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#22c55e,#16a34a);
color:white;
cursor:pointer;
margin-top:10px;
}

a{
color:#22c55e;
text-decoration:none;
}

</style>
</head>

<body>

<div class="card">

<h2>🔐 Login</h2>

<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<p style="margin-top:15px;">
Don't have an account? 
<a href="/register" style="color:#22c55e;">Register</a>
</p>

</div>

</body>
</html>
