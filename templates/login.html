<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    font-family: Poppins;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color: white;
    text-align: center;
    margin-top: 100px;
}

.card {
    background: rgba(255,255,255,0.1);
    padding: 30px;
    display: inline-block;
    border-radius: 15px;
}

input {
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 10px 20px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    color: white;
}

.error {
    color: red;
}
</style>

</head>

<body>

<div class="card">

<h2>Login</h2>

<form method="POST">
<input name="username" placeholder="Username"><br>
<input name="password" type="password" placeholder="Password"><br>
<button>Login</button>
</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<p>New user? <a href="/register" style="color:#38bdf8;">Register</a></p>

</div>

</body>
</html>
